name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deps
        run: pip install -e ".[dev]"
      - name: Ruff (lint)
        run: ruff check custom_components tests
      - name: Mypy (types)
        run: mypy custom_components
      - name: Pytest
        run: pytest -v
